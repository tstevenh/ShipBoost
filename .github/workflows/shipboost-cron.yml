name: ShipBoost Scheduled Crons

# Triggers all production cron routes. Requires two repo secrets:
#   - SITE_URL      e.g. https://shipboost.io
#   - CRON_SECRET   matches CRON_SECRET in the app environment
#
# Secrets are passed through env: blocks (never interpolated into run: scripts)
# to avoid workflow-injection risks.

on:
  schedule:
    # Hourly: publish-due, prelaunch-reminders, revalidate-cache
    - cron: "0 * * * *"
    # Daily at 09:00 UTC: spotlight-reminders, sponsor-renewals
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run (publish-due | prelaunch-reminders | revalidate-cache | spotlight-reminders | sponsor-renewals | all)"
        required: false
        default: "all"

jobs:
  publish-due:
    name: Launches publish-due (hourly)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || github.event.inputs.job == 'publish-due' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/launches/publish-due
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/launches/publish-due"

  prelaunch-reminders:
    name: Launch prep 24h reminders (hourly)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || github.event.inputs.job == 'prelaunch-reminders' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/launches/send-prelaunch-reminders
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/launches/send-prelaunch-reminders"

  revalidate-cache:
    name: Public content revalidate (hourly)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') || github.event.inputs.job == 'revalidate-cache' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/public-content/revalidate
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/public-content/revalidate"

  spotlight-reminders:
    name: Premium launch spotlight reminders (daily 09:00 UTC)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.job == 'spotlight-reminders' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/premium-launch-spotlights/remind-due
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/premium-launch-spotlights/remind-due"

  sponsor-renewals:
    name: Sponsor placement renewals (daily 09:00 UTC)
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 9 * * *') || github.event.inputs.job == 'sponsor-renewals' || github.event.inputs.job == 'all' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: POST /api/cron/sponsor-placements
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/sponsor-placements"
